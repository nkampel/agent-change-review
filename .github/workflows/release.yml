name: Release

# Obsidian requires the release tag to equal the version in manifest.json
# exactly (e.g. 1.0.0, no "v" prefix). Create it with `npm version x.y.z`.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Check tag matches manifest version
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          manifest=$(node -p "require('./manifest.json').version")
          if [ "$tag" != "$manifest" ]; then
            echo "Tag $tag does not match manifest.json version $manifest" >&2
            exit 1
          fi

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" main.js manifest.json styles.css \
            --title "$tag" \
            --generate-notes
